<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <ul class="language">
      <li>JavaScript</li>
    </ul>
  </body>

  <script>

    // funtion to create and add elements using  Program(more Optimistic way)

    function addOptiLanguage(langName) 
    {
      const li = document.createElement('li');
      li.appendChild(document.createTextNode(langName));
      document.querySelector(".language").appendChild(li);
    }

    addOptiLanguage("Python");

    // 2nd function to create and add elements (less optimistic way)

    function addLanguage(langName){
        const li = document.createElement('li');
        li.innerHTML=`${langName}`;
        document.querySelector('.language').appendChild(li);
    }
    addLanguage("goLang")

    // edit

    // 1st Method
    const secondLang = document.querySelector("li:nth-child(2)");
    secondLang.innerHTML="MatLab";

    // 2nd Method
    const otherLang = document.createElement('li');
    otherLang.textContent="Java";
    secondLang.replaceWith(otherLang);

     // 3rd Method (Outer HTML Use)
  
  const firstLang = document.querySelector("li:first-Child");
  firstLang.outerHTML="<li>TypeScript</li>";
  
  //Remove 

  const lastLang = document.querySelector("li:last-child");
  lastLang.remove();




  </script>

  

 
</html>
