<body style="background-color: black; color:bisque;">
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thrusday</div>
    </div>
</body>
<script>

    // parent to child traversing 

    const  parent = document.querySelector('.parent');
    // console.log(parent);
    // console.log(parent.children );
    // console.log(parent.children[0].innerText);

    parent.children[1].style.backgroundColor='blue';

   // Normal Loop can iterate over HTML Collection
    for(let i =0;i<parent.children.length;i++){
        // console.log(parent.children[i].innerHTML);
    }



    // console.log(parent.firstElementChild);
    // console.log(parent.lastElementChild);



    // Child To Parent Traversing
    const dayOne = document.querySelector('.day');
    console.log(dayOne);

    console.log(dayOne.parentElement); // gives parent as output 

    console.log(dayOne.nextElementSibling);// selects element next to day One in same class

    console.log("NODES:", parent.childNodes); // gives a node list of tree structure of DOM of the script, every space and every enter counts


</script>
</html>
