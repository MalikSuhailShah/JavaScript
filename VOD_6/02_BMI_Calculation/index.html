    <div class="container">
     <form>
        <h1>BMI Caculator</h1>
        <p><label>Height In MTRS: </label><input type="text" id="height" /></p>
        <p><label>Weight In KGS: </label><input type="text" id="weight" /></p>
        <button>Calculate</button>

        <div id="result"></div>

        <div id="weight_guide">
            <h3>
                BMI Weight Guide
            </h3>
            <p> Less than 18.6 : Under_Weight</p>
            <p> In range from 18.6 to 24.9 : Normal_Weight</p>
            <p> Greater than 24.9 : Over_Weight</p>
        </div>
    </form>
    </div>
